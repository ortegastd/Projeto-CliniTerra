<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Projeto CliniTerra{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --win-bg: #008080;
            --win-gray: #c0c0c0;
            --win-darkgray: #808080;
            --win-black: #000000;
            --win-white: #ffffff;
            --win-blue: #0000aa;
            --win-light-blue: #0080ff;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'VT323', monospace, 'MS Sans Serif', Arial, sans-serif;
            background-color: var(--win-bg);
            /* Optional pixel background pattern */
            background-image: linear-gradient(45deg, #008080 25%, transparent 25%, transparent 75%, #008080 75%, #008080),
                linear-gradient(45deg, #008080 25%, transparent 25%, transparent 75%, #008080 75%, #008080);
            background-size: 2px 2px;
            background-position: 0 0, 1px 1px;

            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--win-black);
        }

        /* Janela estilo Win95 */
        .win-window {
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-white);
            border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            padding: 2px;
            width: 100%;
            max-width: 700px;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .win-window-inner {
            border-top: 1px solid var(--win-gray);
            border-left: 1px solid var(--win-gray);
            border-right: 1px solid var(--win-darkgray);
            border-bottom: 1px solid var(--win-darkgray);
            padding: 8px;
        }

        /* Barra de Título Win95 */
        .win-titlebar {
            background: linear-gradient(90deg, var(--win-blue), var(--win-light-blue));
            color: var(--win-white);
            padding: 4px 6px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .win-titlebar-icon {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Botões de controle da janela (Fechar) */
        .win-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn-control {
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-white);
            border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            color: var(--win-black);
            cursor: pointer;
            text-decoration: none;
            line-height: 1;
        }

        .win-btn-control:active {
            border-top: 2px solid var(--win-black);
            border-left: 2px solid var(--win-black);
            border-right: 2px solid var(--win-white);
            border-bottom: 2px solid var(--win-white);
            padding-top: 2px;
            padding-left: 2px;
        }

        /* Elementos de Texto */
        h1,
        h2,
        h3,
        p,
        label {
            margin-top: 0;
            color: var(--win-black);
        }

        h2 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        /* Inputs de Texto estilo Win95 (Afundados) */
        .win-input {
            width: 100%;
            padding: 8px;
            background-color: var(--win-white);
            border-top: 2px solid var(--win-darkgray);
            border-left: 2px solid var(--win-darkgray);
            border-right: 2px solid var(--win-white);
            border-bottom: 2px solid var(--win-white);
            box-sizing: border-box;
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: var(--win-black);
            margin-bottom: 15px;
        }

        .win-input:focus {
            outline: none;
            background-color: #f0f0ff;
        }

        select.win-input {
            padding: 4px;
        }

        /* Botões Padrões Win95 */
        .win-btn {
            display: inline-block;
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-white);
            border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            padding: 8px 16px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            font-weight: bold;
            color: var(--win-black);
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: inset 1px 1px 0px var(--win-gray), inset -1px -1px 0px var(--win-darkgray);
        }

        .win-btn:active {
            border-top: 2px solid var(--win-black);
            border-left: 2px solid var(--win-black);
            border-right: 2px solid var(--win-white);
            border-bottom: 2px solid var(--win-white);
            box-shadow: inset 1px 1px 0px var(--win-darkgray);
            padding-top: 10px;
            padding-left: 18px;
        }

        .win-btn-block {
            width: 100%;
            margin-bottom: 10px;
        }

        /* Tabela Win95 */
        .win-table {
            width: 100%;
            background-color: var(--win-white);
            border-top: 2px solid var(--win-darkgray);
            border-left: 2px solid var(--win-darkgray);
            border-right: 2px solid var(--win-white);
            border-bottom: 2px solid var(--win-white);
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .win-table th,
        .win-table td {
            border: 1px solid var(--win-gray);
            padding: 6px;
            font-size: 18px;
        }

        .win-table th {
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-white);
            border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-darkgray);
            border-bottom: 2px solid var(--win-darkgray);
            text-align: left;
        }

        /* Containers */
        .win-fieldset {
            border-top: 2px solid var(--win-white);
            border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-darkgray);
            border-bottom: 2px solid var(--win-darkgray);
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .win-legend {
            background-color: var(--win-gray);
            padding: 0 5px;
            position: absolute;
            top: -12px;
            left: 10px;
        }

        /* Alertas / Caixas de Mensagem */
        .win-alert {
            background-color: var(--win-white);
            border: 1px solid var(--win-black);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .win-alert-error {
            border-left: 4px solid red;
        }

        .win-alert-success {
            border-left: 4px solid green;
        }

        /* Mosaico de Datas / Horas */
        .win-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .win-grid-item input[type="radio"] {
            display: none;
        }

        .win-grid-item label {
            display: inline-block;
            background-color: var(--win-gray);
            border-top: 2px solid var(--win-white);
            border-left: 2px solid var(--win-white);
            border-right: 2px solid var(--win-black);
            border-bottom: 2px solid var(--win-black);
            padding: 4px 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .win-grid-item input[type="radio"]:checked+label {
            border-top: 2px solid var(--win-black);
            border-left: 2px solid var(--win-black);
            border-right: 2px solid var(--win-white);
            border-bottom: 2px solid var(--win-white);
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVQIW2NkYGD4z8DAwMgAI0AMCKcCBXY/e2gAAAAASUVORK5CYII=');
            /* Dithered pattern */
        }

        .win-grid-item label:active {
            border-top: 2px solid var(--win-black);
            border-left: 2px solid var(--win-black);
            border-right: 2px solid var(--win-white);
            border-bottom: 2px solid var(--win-white);
        }

        a {
            color: var(--win-blue);
        }

        a:hover {
            color: var(--win-light-blue);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="win-window" {% block window_attrs %}{% endblock %}>
        <div class="win-titlebar">
            <div class="win-titlebar-icon">
                {% block titlebar_icon %}💾{% endblock %}
                <span>{% block titlebar_text %}CliniTerra.exe{% endblock %}</span>
            </div>
            <div class="win-controls">
                <div class="win-btn-control">_</div>
                <div class="win-btn-control">□</div>
                <a href="{% block close_url %}/{% endblock %}" class="win-btn-control">X</a>
            </div>
        </div>

        <div class="win-window-inner">
            <!-- Barra de Menus Clássica -->
            {% block menu_bar %}
            <div
                style="border-bottom: 1px solid var(--win-darkgray); padding-bottom: 4px; margin-bottom: 10px; font-size: 18px;">
                <u>F</u>ile &nbsp;&nbsp; <u>E</u>dit &nbsp;&nbsp; <u>V</u>iew &nbsp;&nbsp; <u>H</u>elp
            </div>
            {% endblock %}

            <div style="padding: 10px;">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script>
        // Função para gerar sons sintéticos estilo Win95/Retro
        function playRetroClick(e) {
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!window.audioCtx) {
                    window.audioCtx = new AudioContext();
                }
                if (window.audioCtx.state === 'suspended') {
                    window.audioCtx.resume();
                }
                const osc = window.audioCtx.createOscillator();
                const gain = window.audioCtx.createGain();
                
                let type = 'default';
                const el = e.currentTarget;
                const text = (el.innerText || el.value || '').toLowerCase();
                
                if (el.matches('input[type="radio"], input[type="checkbox"]')) {
                    type = 'tick';
                } else if (el.matches('.win-btn-control')) {
                    type = 'window_control';
                } else if (el.hasAttribute('onclick') && el.getAttribute('onclick').includes('confirm') || text.includes('apagar') || text.includes('excluir')) {
                    type = 'alert';
                } else if (text.includes('cadastrar') || text.includes('salvar') || text.includes('agendar')) {
                    type = 'success';
                } else if (text.includes('cancelar') || text.includes('voltar') || text.includes('sair')) {
                    type = 'cancel';
                } else if (el.matches('a:not(.win-btn)')) {
                    type = 'link';
                }

                osc.connect(gain);
                gain.connect(window.audioCtx.destination);
                const now = window.audioCtx.currentTime;

                if (type === 'tick') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.02);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.02);
                    osc.start(now);
                    osc.stop(now + 0.02);
                } else if (type === 'link') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
                    osc.start(now);
                    osc.stop(now + 0.03);
                } else if (type === 'alert') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'success') {
                    // Som alegre subindo (como se fosse de confirmação)
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(600, now + 0.05);
                    osc.frequency.setValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'cancel') {
                    // Som descendo (cancelamento)
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'window_control') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.04);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else {
                    // O thud/click clássico com pequenas variações aleatórias para não ficar repetitivo
                    const baseFreq = 500 + Math.random() * 200;
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.1, now + 0.05);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(err) {
                console.error("Audio API not supported", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const clickableElements = document.querySelectorAll('.win-btn, .win-btn-control, input[type="radio"], input[type="checkbox"], a');
            clickableElements.forEach(el => {
                el.addEventListener('mousedown', playRetroClick);
            });
        });

        // Formatação automática de campos (Nome e Telefone)
        document.addEventListener('input', (e) => {
            const el = e.target;
            
            // Nomes (primeira letra maiúscula, ignorando preposições)
            if (el.name === 'nome' || el.id === 'nome') {
                const preposicoes = ["da", "de", "do", "das", "dos", "e"];
                let val = el.value.toLowerCase();
                let words = val.split(' ');
                el.value = words.map((word, index) => {
                    if (index !== 0 && preposicoes.includes(word)) {
                        return word;
                    }
                    if (word.length > 0) {
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    }
                    return word;
                }).join(' ');
            }
            
            // Telefone: (XX) XXXXX-XXXX
            if (el.name === 'telefone' || el.id === 'telefone') {
                let val = el.value.replace(/\D/g, ''); // Remove tudo que não é número
                if (val.length > 11) val = val.slice(0, 11);
                
                if (val.length > 10) {
                    val = val.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
                } else if (val.length > 6) {
                    val = val.replace(/^(\d{2})(\d{4,5})(\d{0,4})/, '($1) $2-$3');
                } else if (val.length > 2) {
                    val = val.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
                } else if (val.length > 0) {
                    val = val.replace(/^(\d*)/, '($1');
                }
                el.value = val;
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
