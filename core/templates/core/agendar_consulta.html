<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta - Projeto CliniTerra</title>
    <style>
        :root {
            --marrom-escuro: #3E2723;
            --marrom-claro: #8C391A;
            --cinza-claro: #D3D3D3;
            --branco: #FFFFFF;
            --verde-sucesso: #2E7D32;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #973F2D 0%, #532A1B 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-cadastro {
            background-color: var(--marrom-escuro);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px; 
            color: var(--branco);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--cinza-claro);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--cinza-claro);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(211, 211, 211, 0.4);
            border-radius: 6px;
            background-color: transparent;
            color: var(--branco);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        select option {
            background-color: var(--marrom-escuro);
            color: var(--branco);
        }

        .datas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .data-card {
            background-color: var(--marrom-escuro);
            border: 1px solid rgba(211, 211, 211, 0.4);
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .data-card:hover {
            border-color: var(--marrom-claro);
            background-color: rgba(140, 57, 26, 0.2);
        }

        .data-card input[type="radio"] {
            display: none;
        }

        .data-card input[type="radio"]:checked + .data-content {
            color: var(--branco);
        }
        
        .data-card:has(input[type="radio"]:checked) {
            background-color: var(--marrom-claro);
            border-color: var(--marrom-claro);
        }

        .data-dia {
            font-size: 20px;
            font-weight: bold;
            display: block;
        }

        .data-mes {
            font-size: 12px;
            text-transform: uppercase;
        }

        .time-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .time-card {
            margin: 0;
            padding: 0;
        }
        .time-card input[type="radio"] {
            display: none;
        }
        .time-label {
            display: inline-block;
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(211, 211, 211, 0.2);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--branco);
            transition: all 0.2s;
        }
        .time-card input[type="radio"]:checked + .time-label {
            background-color: var(--marrom-claro);
            border-color: var(--marrom-claro);
            font-weight: bold;
        }
        .time-label:hover {
            background-color: rgba(140, 57, 26, 0.5);
            border-color: rgba(140, 57, 26, 0.5);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--marrom-claro);
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            background-color: var(--marrom-claro);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .btn-enviar:hover {
            background-color: #BCAAA4;
            color: var(--marrom-escuro);
        }

        .btn-voltar {
            display: block;
            text-align: center;
            color: var(--cinza-claro);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .btn-voltar:hover {
            color: var(--branco);
            text-decoration: underline;
        }

        .mensagem-sucesso {
            background-color: var(--verde-sucesso);
            color: var(--branco);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card-cadastro">
        <h2>Agendar Consulta</h2>

        {% if sucesso %}
            <div class="mensagem-sucesso">
                ✓ Consulta agendada com sucesso!
            </div>
        {% endif %}

        <form method="POST" action="{% url 'agendar_consulta' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="paciente">Paciente</label>
                <select id="paciente" name="paciente" required>
                    <option value="">Selecione o paciente...</option>
                    {% for u in usuarios %}
                        <option value="{{ u.id_usuario }}">{{ u.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Consulta/Exame</label>
                <select id="tipo" name="tipo" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="Consulta - Clínica Geral">Consulta - Clínica Geral</option>
                    <option value="Consulta - Odontologia">Consulta - Odontologia</option>
                    <option value="Consulta - Dermatologia">Consulta - Dermatologia</option>
                    <option value="Consulta - Cardiologia">Consulta - Cardiologia</option>
                    <option value="Exame - Ultrassom">Exame - Ultrassom</option>
                    <option value="Exame - Raio-X">Exame - Raio-X</option>
                    <option value="Exame - Sangue/Laboratório">Exame - Sangue/Laboratório</option>
                    <option value="Retorno">Retorno de Consulta</option>
                </select>
            </div>

            <div class="form-group">
                <label>Data</label>
                <div class="calendar-container">
                    <div class="calendar-header">{{ calendario.mes_nome }} {{ calendario.ano }}</div>
                    <div class="calendar-weekdays">
                        <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
                    </div>
                    <div class="calendar-days">
                        {% for semana in calendario.semanas %}
                            {% for dia in semana %}
                                <label class="day-card">
                                    {% if dia.disponivel %}
                                        <input type="radio" name="data" value="{{ dia.iso }}" required>
                                        <span class="day-label">{{ dia.dia }}</span>
                                    {% else %}
                                        <span class="day-label disabled">{{ dia.dia }}</span>
                                    {% endif %}
                                </label>
                            {% endfor %}
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Horário</label>
                <div class="time-grid">
                    <label class="time-card"><input type="radio" name="hora" value="08:00" required><span class="time-label">08:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="09:00" required><span class="time-label">09:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="10:00" required><span class="time-label">10:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="11:00" required><span class="time-label">11:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="14:00" required><span class="time-label">14:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="15:00" required><span class="time-label">15:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="16:00" required><span class="time-label">16:00</span></label>
                    <label class="time-card"><input type="radio" name="hora" value="17:00" required><span class="time-label">17:00</span></label>
                </div>
            </div>

            <button type="submit" class="btn-enviar">AGENDAR</button>
            
            <a href="{% url 'lista_clientes' %}" class="btn-voltar">← Voltar para o Painel</a>
        </form>
    </div>
</body>
</html>
