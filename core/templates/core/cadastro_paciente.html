<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto CliniTerra</title>
    <style>
        :root {
            --marrom-escuro: #3E2723;
            --marrom-claro: #8C391A;
            --cinza-claro: #D3D3D3;
            --branco: #FFFFFF;
            --vermelho: #D32F2F;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #973F2D 0%, #532A1B 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-cadastro {
            background-color: var(--marrom-escuro);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px; 
            color: var(--branco);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--cinza-claro);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--cinza-claro);
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(211, 211, 211, 0.4);
            border-radius: 6px;
            background-color: transparent;
            color: var(--branco);
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--marrom-claro);
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            background-color: var(--marrom-claro);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .btn-enviar:hover {
            background-color: #BCAAA4;
            color: var(--marrom-escuro);
        }

        .btn-voltar {
            display: block;
            text-align: center;
            color: var(--cinza-claro);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .btn-voltar:hover {
            color: var(--branco);
            text-decoration: underline;
        }

        .error-message {
            color: #FFBDBD;
            background-color: rgba(211, 47, 47, 0.3);
            border: 1px solid var(--vermelho);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card-cadastro">
        <h2>Criar Conta</h2>

        {% if erro %}
            <div class="error-message">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'cadastro_paciente' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(DD) 99999-9999" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha (Mínimo de 8 caracteres)</label>
                <div style="position: relative;">
                    <input type="password" id="senha" name="senha" minlength="8" placeholder="Digite sua senha" required style="padding-right: 40px;">
                    <span id="toggleSenha" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; display: flex; align-items: center;" title="Mostrar/Ocultar Senha">
                        <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--cinza-claro)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--cinza-claro)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-enviar">CADASTRAR</button>
            
            <a href="{% url 'home' %}" class="btn-voltar">Já tenho conta. Fazer Login</a>
        </form>
    </div>

    <script>
        const toggleSenha = document.getElementById('toggleSenha');
        const senhaInput = document.getElementById('senha');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        toggleSenha.addEventListener('click', function () {
            const isPassword = senhaInput.getAttribute('type') === 'password';
            senhaInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeClosed.style.display = isPassword ? 'block' : 'none';
        });
    </script>
</body>
</html>
