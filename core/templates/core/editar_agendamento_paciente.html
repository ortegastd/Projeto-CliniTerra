<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Consulta - Projeto CliniTerra</title>
    <style>
        :root {
            --marrom-escuro: #3E2723;
            --marrom-claro: #8C391A;
            --cinza-claro: #D3D3D3;
            --branco: #FFFFFF;
            --verde-sucesso: #2E7D32;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #973F2D 0%, #532A1B 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-cadastro {
            background-color: var(--marrom-escuro);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px; 
            color: var(--branco);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--cinza-claro);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--cinza-claro);
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(211, 211, 211, 0.4);
            border-radius: 6px;
            background-color: transparent;
            color: var(--branco);
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Hack to make date/time pickers look good in some browsers */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        input:focus {
            outline: none;
            border-color: var(--marrom-claro);
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            background-color: var(--marrom-claro);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .btn-enviar:hover {
            background-color: #BCAAA4;
            color: var(--marrom-escuro);
        }

        .btn-voltar {
            display: block;
            text-align: center;
            color: var(--cinza-claro);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .btn-voltar:hover {
            color: var(--branco);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card-cadastro">
        <h2>Editar Consulta</h2>

        <form method="POST" action="{% url 'editar_agendamento_paciente' consulta.id_consulta %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="tipo">Tipo de Consulta/Exame</label>
                <select id="tipo" name="tipo" required>
                    <option value="Consulta - Clínica Geral" {% if consulta.tipo == "Consulta - Clínica Geral" %}selected{% endif %}>Consulta - Clínica Geral</option>
                    <option value="Consulta - Odontologia" {% if consulta.tipo == "Consulta - Odontologia" %}selected{% endif %}>Consulta - Odontologia</option>
                    <option value="Consulta - Dermatologia" {% if consulta.tipo == "Consulta - Dermatologia" %}selected{% endif %}>Consulta - Dermatologia</option>
                    <option value="Consulta - Cardiologia" {% if consulta.tipo == "Consulta - Cardiologia" %}selected{% endif %}>Consulta - Cardiologia</option>
                    <option value="Exame - Ultrassom" {% if consulta.tipo == "Exame - Ultrassom" %}selected{% endif %}>Exame - Ultrassom</option>
                    <option value="Exame - Raio-X" {% if consulta.tipo == "Exame - Raio-X" %}selected{% endif %}>Exame - Raio-X</option>
                    <option value="Exame - Sangue/Laboratório" {% if consulta.tipo == "Exame - Sangue/Laboratório" %}selected{% endif %}>Exame - Sangue/Laboratório</option>
                    <option value="Retorno" {% if consulta.tipo == "Retorno" %}selected{% endif %}>Retorno de Consulta</option>
                    <!-- Fallback se já houvesse outro valor salvo antes no banco -->
                    {% if consulta.tipo not in "Consulta - Clínica Geral,Consulta - Odontologia,Consulta - Dermatologia,Consulta - Cardiologia,Exame - Ultrassom,Exame - Raio-X,Exame - Sangue/Laboratório,Retorno" %}
                        <option value="{{ consulta.tipo }}" selected>{{ consulta.tipo }} (Anterior)</option>
                    {% endif %}
                </select>
            </div>

            <div class="form-group">
                <label for="data">Data</label>
                <input type="date" id="data" name="data" value="{{ consulta.data|date:'Y-m-d' }}" required>
            </div>

            <div class="form-group">
                <label for="hora">Hora</label>
                <input type="time" id="hora" name="hora" value="{{ consulta.hora|time:'H:i' }}" required>
            </div>

            <button type="submit" class="btn-enviar">SALVAR ALTERAÇÕES</button>
            
            <a href="{% url 'consultar_agendamentos' %}" class="btn-voltar">← Cancelar</a>
        </form>
    </div>
</body>
</html>
