<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - Projeto CliniTerra</title>
    <style>
        :root {
            --marrom-escuro: #3E2723;
            --marrom-claro: #8C391A;
            --cinza-claro: #D3D3D3;
            --branco: #FFFFFF;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #973F2D 0%, #532A1B 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ÍCONE DISFARÇADO DO BANCO DE DADOS (SÓ PARA TESTES) */
        .acesso-secreto {
            position: fixed;
            bottom: 15px;
            right: 15px;
            text-decoration: none;
            font-size: 16px;
            opacity: 0.2;
        }

        .acesso-secreto:hover {
            opacity: 1.0;
        }

        .card-home {
            background-color: var(--marrom-escuro);
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px; 
            color: var(--branco);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--branco);
        }

        p {
            color: var(--cinza-claro);
            font-size: 16px;
            margin-bottom: 35px;
        }

        .btn-entrar {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: var(--marrom-claro);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-entrar:hover {
            background-color: #BCAAA4;
            color: var(--marrom-escuro);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <a href="{% url 'lista_clientes' %}" class="acesso-secreto" title="Acesso Administrativo">🛢️</a>

    <div class="card-home">
        <h1>Projeto CliniTerra</h1>
        <p>Faça login para ver suas consultas!</p>

        {% if erro %}
            <div style="color: #FFBDBD; background-color: rgba(211, 47, 47, 0.3); border: 1px solid var(--vermelho); padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'home' %}">
            {% csrf_token %}
            <div style="margin-bottom: 15px; text-align: left;">
                <label for="email" style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--cinza-claro);">E-mail</label>
                <input type="email" name="email" id="email" placeholder="seu@email.com" required style="width: 100%; padding: 12px; border: 1px solid rgba(211, 211, 211, 0.4); border-radius: 6px; background-color: transparent; color: var(--branco); font-size: 14px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 25px; text-align: left;">
                <label for="senha" style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--cinza-claro);">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Sua senha secreta" required style="width: 100%; padding: 12px; border: 1px solid rgba(211, 211, 211, 0.4); border-radius: 6px; background-color: transparent; color: var(--branco); font-size: 14px; box-sizing: border-box;">
            </div>
            
            <button type="submit" class="btn-entrar" style="margin-bottom: 15px;">ENTRAR</button>
        </form>

        <a href="{% url 'cadastro_paciente' %}" style="color: var(--cinza-claro); font-size: 14px; text-decoration: none;">Ainda não tem conta? <span style="text-decoration: underline;">Cadastre-se</span></a>
    </div>
</body>
</html>
